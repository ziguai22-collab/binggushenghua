<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#2e2e2e" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="只属于两个人的本地字卡传讯窗口" />
  <title>病骨生花</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles-v39.css" />
  <script>
    (() => {
      const release = "39";
      try {
        if (sessionStorage.getItem("binggushenghua-release") === release) return;
        sessionStorage.setItem("binggushenghua-release", release);
        if ("caches" in window) caches.keys().then((keys) => Promise.all(keys.filter((key) => key.startsWith("binggushenghua")).map((key) => caches.delete(key)))).catch(() => {});
        if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((items) => Promise.all(items.map((item) => item.unregister()))).catch(() => {});
      } catch {}
    })();
  </script>
</head>
<body>
  <div class="opening-screen" id="openingScreen" aria-label="正在进入页面">
    <canvas id="openingCanvas" aria-hidden="true"></canvas>
    <div class="opening-copy"><span>OUR PRIVATE SIGNAL</span><p id="openingWelcome"></p><i></i></div>
    <button id="skipOpening" aria-label="跳过开屏动画">跳过</button>
  </div>
  <main class="chat-app">
    <aside class="side-rail" id="sideRail" aria-label="功能侧边栏">
      <button class="profile-mark memory-mark" id="profileButton" title="纪念日" aria-label="纪念日"><span id="myMark">1</span></button>
      <nav>
        <button class="rail-button active" data-tool="conversations" aria-label="打开侧边栏"><svg viewBox="0 0 24 24"><path d="M4 5.5h16v11H9l-5 3v-14Z"/></svg></button>
        <span class="rail-rule"></span>
        <button class="rail-button" data-tool="cards" title="字卡" aria-label="字卡"><svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 8h6M9 12h6M9 16h4"/></svg></button>
        <button class="rail-button" data-tool="stickers" title="表情" aria-label="表情"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 10h.01M15 10h.01M9 14c1.6 1.4 4.4 1.4 6 0"/></svg></button>
        <button class="rail-button" data-tool="appearance" title="设置" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></button>
        <button class="rail-button" data-tool="data" title="数据" aria-label="数据"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zM8 9h8M8 13h8M8 17h5"/></svg></button>
      </nav>
      <button class="theme-button" id="themeButton" title="切换深浅模式" aria-label="切换深浅模式"><svg viewBox="0 0 24 24"><path d="M18 15a7 7 0 0 1-9-9 7 7 0 1 0 9 9Z"/></svg></button>
    </aside>

    <aside class="tool-drawer" id="toolDrawer" aria-hidden="true">
      <div class="sidebar-wallpaper-layer" aria-hidden="true"></div>
      <div class="sidebar-wallpaper-veil" aria-hidden="true"></div>
      <header><button id="drawerBack" aria-label="返回聊天">‹</button><strong id="drawerTitle"></strong><button id="drawerClose" aria-label="关闭">×</button></header>
      <div class="drawer-content" id="drawerContent"></div>
    </aside>
    <button class="tool-scrim" id="toolScrim" aria-label="关闭对话侧边栏" hidden></button>

    <button class="drawer-scrim" id="optionsScrim" aria-label="关闭聊天设置" hidden></button>
    <aside class="chat-options" id="chatOptions" aria-hidden="true">
      <div class="sidebar-wallpaper-layer" aria-hidden="true"></div>
      <div class="sidebar-wallpaper-veil" aria-hidden="true"></div>
      <header><strong>聊天设置</strong><button id="optionsClose" aria-label="关闭聊天设置">×</button></header>
      <div class="chat-options-content" id="chatOptionsContent"></div>
    </aside>

    <section class="chat-window">
      <div class="chat-wallpaper-layer" id="chatWallpaper" aria-hidden="true"></div>
      <div class="chat-wallpaper-veil" aria-hidden="true"></div>
      <header class="chat-topbar">
        <button class="mobile-menu-button" id="mobileMenu" aria-label="打开功能菜单"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="chat-person"><strong id="loverName">对方</strong><span id="presence" hidden>讯号在线</span></div>
        <button class="more-button" id="chatInfoButton" aria-label="聊天设置"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></svg></button>
      </header>

      <div class="message-list" id="messageList">
        <div id="messages"></div>
        <div id="typing" class="message-row lover typing-row" hidden><div class="message-avatar avatar lover-mark"><span>爱</span></div><div class="typing-bubble"><i></i><i></i><i></i></div></div>
        <div id="messageEnd"></div>
      </div>

      <div class="popover sticker-popover" id="stickerPopover" hidden></div>
      <div class="popover more-popover" id="morePopover" hidden></div>

      <footer class="composer">
        <div class="composer-quote-preview" id="composerQuote" hidden></div>
        <button class="composer-icon plus-button" id="plusButton" title="更多功能" aria-label="更多功能"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="composer-icon" id="stickerButton" title="发送表情包" aria-label="发送表情包"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 10h.01M15 10h.01M9 14c1.6 1.4 4.4 1.4 6 0"/></svg></button>
        <input id="imageFile" type="file" accept="image/*" hidden>
        <textarea id="draft" rows="1" placeholder="输入消息" aria-label="消息内容"></textarea>
        <button id="replyButton" class="reply-trigger" title="点击后让他回复" aria-label="点击后让他回复"><svg viewBox="0 0 24 24"><path d="M5 6h14v10H9l-4 3V6Z"/><path d="m16 2 .7 1.8 1.8.7-1.8.7L16 7l-.7-1.8-1.8-.7 1.8-.7L16 2Z"/></svg></button>
        <span id="modeLabel" class="visually-hidden">随机传讯</span>
      </footer>
    </section>
  </main>
  <div class="toast" id="toast" hidden></div>
  <div class="media-viewer" id="mediaViewer" hidden role="dialog" aria-modal="true" aria-label="查看图片">
    <button class="media-viewer-close" id="mediaViewerClose" aria-label="关闭图片预览">×</button>
    <img id="mediaViewerImage" alt="聊天图片">
  </div>
  <div class="choice-editor" id="choiceEditor" hidden role="dialog" aria-modal="true" aria-label="新建我问你">
    <button class="choice-editor-scrim" id="choiceEditorScrim" aria-label="关闭我问你"></button>
    <section class="choice-editor-sheet">
      <header><div><span>我问你</span><strong>让他在下一轮给出答案</strong></div><button id="choiceEditorClose" aria-label="关闭">×</button></header>
      <label><span>问题</span><input id="choiceQuestion" maxlength="120" placeholder="想问他什么？"></label>
      <label><span>答案选项 · 一行一个</span><textarea id="choiceOptions" rows="5" placeholder="第一个答案&#10;第二个答案&#10;第三个答案"></textarea></label>
      <div class="choice-mode" role="radiogroup" aria-label="选择方式">
        <button class="active" data-choice-mode="single">单选</button>
        <button data-choice-mode="multiple">多选</button>
        <button data-choice-mode="ranking">排序</button>
      </div>
      <p id="choiceModeHelp">他会从所有选项里选择一个。</p>
      <button class="choice-submit" id="choiceSubmit">发送到聊天</button>
    </section>
  </div>
  <div class="tarot-editor" id="tarotEditor" hidden role="dialog" aria-modal="true" aria-label="邀请爱人抽塔罗牌">
    <button class="tarot-editor-scrim" id="tarotEditorScrim" aria-label="关闭塔罗设置"></button>
    <section class="tarot-editor-sheet">
      <span class="tarot-editor-wallpaper" id="tarotEditorWallpaper" aria-hidden="true"></span>
      <span class="tarot-editor-veil" aria-hidden="true"></span>
      <div class="tarot-editor-content">
        <header><div><span>TAROT READING</span><strong>邀请他替你抽牌</strong></div><button id="tarotEditorClose" aria-label="关闭">×</button></header>
        <label><span>想问的问题 · 可留空</span><textarea id="tarotQuestion" rows="3" maxlength="160" placeholder="把此刻想知道的事写下来"></textarea></label>
        <div class="tarot-count-field">
          <span>抽牌张数</span>
          <div><button id="tarotCountDown" aria-label="减少一张">−</button><input id="tarotCount" type="number" min="1" max="78" value="3" inputmode="numeric" aria-label="抽牌张数"><button id="tarotCountUp" aria-label="增加一张">＋</button></div>
        </div>
        <label class="tarot-toggle"><span><b>允许逆位</b><small>每张牌独立决定正位或逆位</small></span><input id="tarotReversed" type="checkbox"><i></i></label>
        <button class="tarot-submit" id="tarotSubmit">发送邀请</button>
      </div>
    </section>
  </div>
  <div class="tarot-ritual" id="tarotRitual" hidden role="dialog" aria-modal="true" aria-label="塔罗抽牌">
    <span class="tarot-ritual-wallpaper" id="tarotRitualWallpaper" aria-hidden="true"></span>
    <span class="tarot-ritual-veil" aria-hidden="true"></span>
    <canvas id="tarotCanvas" aria-hidden="true"></canvas>
    <button class="tarot-ritual-close" id="tarotRitualClose" aria-label="关闭塔罗牌室">×</button>
    <main class="tarot-ritual-content">
      <header><span id="tarotRitualKicker">THE CARDS ARE LISTENING</span><h2 id="tarotRitualTitle">他正在洗牌</h2><p id="tarotRitualQuestion"></p></header>
      <div class="tarot-shuffle-stage" id="tarotShuffleStage" aria-live="polite"></div>
      <div class="tarot-result-cards" id="tarotRitualCards" hidden></div>
      <button class="tarot-skip" id="tarotSkip">跳过动画</button>
      <button class="tarot-done" id="tarotRitualDone" hidden>收下这次牌面</button>
    </main>
  </div>
  <script src="./app-v39.js" defer></script>
</body>
</html>
